name: Alerts

on:
  push:
    branches:
      - main

jobs:
  notify-discord:
    runs-on: ubuntu-latest

    steps:
      - name: Notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPOSITORY_NAME: ${{ github.repository }}
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL secret is not configured. Skipping alert."
            exit 0
          fi

          payload=$(printf '{"content":"GitHub Actions alert: %s recebeu um push em %s. Commit: %s"}' "$REPOSITORY_NAME" "$BRANCH_NAME" "$COMMIT_SHA")

          curl -H "Content-Type: application/json" -d "$payload" "$DISCORD_WEBHOOK_URL"